name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: Shell syntax
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Bash syntax check
        run: bash -n bin/agently lib/*.sh tests/*.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned ShellCheck
        run: scripts/install-shellcheck.sh

      - name: Run ShellCheck
        run: shellcheck bin/agently lib/*.sh tests/*.sh

  smoke:
    name: Smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned ShellCheck
        run: scripts/install-shellcheck.sh

      - name: Run smoke tests
        run: ./tests/smoke.sh
