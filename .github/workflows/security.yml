name: Security

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-adversarial:
    name: Security adversarial
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run security adversarial tests
        run: ./tests/security-adversarial.sh

  config-allowlist:
    name: Config allowlist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run config allowlist tests
        run: ./tests/config-allowlist.sh
